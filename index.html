<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Critical shell: painted by the browser before the stylesheet arrives, so
      the page never shows the default white canvas between "document received"
      and "CSS parsed" — on a real connection that gap is a few hundred
      milliseconds and reads as a white flash on every load. `color-scheme`
      additionally keeps the UA (scrollbar, form controls) dark from the same
      first frame. This stays inline and render-blocking on purpose; the values
      are duplicated in src/index.css.
    -->
    <style>
      html {
        background-color: #050816;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Poppins is self-hosted (see @font-face in src/index.css) so it starts
      downloading at HTML-parse time instead of waiting for a cross-origin
      stylesheet to arrive and be parsed first. That one saved round trip is
      what keeps the hero <h1> from painting in a fallback font and then
      repainting — the repaint is recorded as a new LCP candidate.

      Every weight the first screen needs is preloaded: 400/500/600/700/800
      for the navbar and hero, and 900 (.section-head) because the About
      section mounts on first load rather than on scroll. Without a preload,
      900 was discovered last and became the tail of the longest critical
      request chain. `crossorigin` is mandatory for font preloads even
      same-origin.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-800-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-700-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-600-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400-latin.woff2" crossorigin />
    <!--
      Weight 900 is `.section-head`, and the About section mounts on first
      load, so this face is needed immediately too. Preloading it keeps it off
      the tail of the document -> CSS -> font chain (246 ms real before, and the
      single biggest contributor to the modelled LCP).
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-900-latin.woff2" crossorigin />
